[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-lc-1dcnn"
version = "1.0.0"
description = "Lightweight multi-task 1D-CNN for simulated wireless LC spectrum decoding"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Wenjie Lu" }]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.26,<3",
  "pandas>=2,<3",
  "pillow>=12.3,<13",
  "torch>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
wireless-lc-train = "wireless_lc_1dcnn.train:main"
wireless-lc-infer = "wireless_lc_1dcnn.inference:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
